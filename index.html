  <!-- Splash screen CSS — se carga antes que cualquier otra hoja de estilos -->
  <style>
    #app-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #FAF8F5;
      transition: opacity .5s ease, visibility .5s ease;

    [data-theme="dark"] #app-splash { background: #1C1A18; }
    #app-splash.splash-out { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-inner {
      display: flex; flex-direction: column; align-items: center;
      gap: 1.4rem; text-align: center;
    }
    .splash-symbol {
      width: 80px; height: 80px; border-radius: 50%;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      animation: splash-breathe 1.6s ease-in-out infinite;
      box-shadow: 0 4px 18px rgba(232,145,106,.35);
    }
    .splash-symbol img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .splash-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 1rem; font-weight: 700; letter-spacing: -.01em;
      color: #1C1A18; margin: 0;
    }
    [data-theme="dark"] .splash-title { color: #FAF8F5; }
    .splash-sub {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: .72rem; font-weight: 400; color: #8C7B70;
      margin: -.8rem 0 0;
    }
    .splash-track {
      width: 140px; height: 2px; background: rgba(140,123,112,.18);
      border-radius: 2px; overflow: hidden;
    }
    .splash-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #E8916A, #EDDF52);
      animation: splash-bar 1.5s ease-in-out infinite;
    }
    @keyframes splash-breathe {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,145,106,.4); }
      50%      { transform: scale(1.06); box-shadow: 0 0 0 10px rgba(232,145,106,0); }
    }
    @keyframes splash-bar {
      0%   { width: 0%;   margin-left: 0; }
      60%  { width: 100%; margin-left: 0; }
      100% { width: 0%;   margin-left: 100%; }
    }
  </style>
